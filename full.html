<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Trắc Nghiệm</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --card: #fffdf8;
      --ink: #1a1209;
      --accent: #c0392b;
      --accent2: #e67e22;
      --muted: #7a6f5e;
      --border: #d9cfc0;
      --correct: #27ae60;
      --wrong: #c0392b;
      --unanswered: #e67e22;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 780px;
      margin: 0 auto 2.5rem;
      text-align: center;
      border-bottom: 3px double var(--accent);
      padding-bottom: 1.5rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: var(--accent);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .quiz-container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--accent);
      border-left: 4px solid var(--accent);
      padding: 0.3rem 0.8rem;
      background: #fdf0ed;
      border-radius: 0 4px 4px 0;
      margin-top: 1rem;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      box-shadow: 2px 3px 0 var(--border);
      transition: box-shadow 0.2s;
    }

    .question-card:hover {
      box-shadow: 3px 5px 0 #c9bfb0;
    }

    .question-text {
      font-weight: 600;
      font-size: 0.97rem;
      margin-bottom: 0.9rem;
      line-height: 1.5;
    }

    .question-num {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .options {
      display: grid;
      gap: 0.5rem;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .option-label:hover {
      background: #f0e8d8;
      border-color: var(--accent2);
    }

    .option-label input[type="radio"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .option-label.correct {
      background: #eafaf1;
      border-color: var(--correct);
      color: #1e6b42;
      font-weight: 600;
    }

    .option-label.wrong {
      background: #fdecec;
      border-color: var(--wrong);
      color: var(--wrong);
      font-weight: 600;
    }

    .result-msg {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 1.2em;
    }

    .result-msg.correct { color: var(--correct); }
    .result-msg.wrong { color: var(--wrong); }
    .result-msg.unanswered { color: var(--unanswered); }

    .footer-bar {
      max-width: 780px;
      margin: 2.5rem auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    #score-display {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--ink);
      display: none;
    }

    #score-display span { color: var(--accent); }

    .btn-check {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem 2.8rem;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 3px 4px 0 #8e1a10;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-check:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0 #8e1a10;
    }

    .btn-reset {
      background: transparent;
      border: 2px solid var(--muted);
      color: var(--muted);
      padding: 0.6rem 1.8rem;
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover { border-color: var(--ink); color: var(--ink); }

    .progress-bar-wrap {
      width: 100%;
      background: var(--border);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 20px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .progress-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>

<header>
  <h1>📝 Bài Trắc Nghiệm <span data-fill="subject">…</span></h1>
  <p data-fill="subtitle">…</p>
</header>

<div class="quiz-container" id="quizContainer"></div>

<div class="footer-bar">
  <div class="progress-bar-wrap" style="max-width:780px;width:100%">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel"></div>
  <button class="btn-check" onclick="checkAll()">✅ Kiểm tra tất cả</button>
  <button class="btn-reset" onclick="resetAll()">🔄 Làm lại</button>
  <div id="score-display"></div>
</div>

<script src="exam-loader.js"></script>
<script>
let questions = [];   // được nạp từ de-kiem-tra.html (xem phần khởi động ở cuối file)

const optionLetters = ['A', 'B', 'C', 'D'];
const container = document.getElementById('quizContainer');

function buildQuiz() {
  container.innerHTML = '';
  questions.forEach((item, idx) => {
    if (item.section) {
      const sec = document.createElement('div');
      sec.className = 'section-title';
      sec.textContent = item.section;
      container.appendChild(sec);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${idx}`;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerHTML = `<span class="question-num">${idx + 1}</span> ${item.q}`;
    card.appendChild(qText);

    const opts = document.createElement('div');
    opts.className = 'options';

    item.opts.forEach((opt, oi) => {
      const lbl = document.createElement('label');
      lbl.className = 'option-label';
      lbl.id = `lbl-${idx}-${oi}`;
      lbl.innerHTML = `<input type="radio" name="q${idx}" value="${oi}"> <strong>${optionLetters[oi]}.</strong> ${opt}`;
      lbl.querySelector('input').addEventListener('change', () => updateProgress());
      opts.appendChild(lbl);
    });

    card.appendChild(opts);

    const res = document.createElement('div');
    res.className = 'result-msg';
    res.id = `res-${idx}`;
    card.appendChild(res);

    container.appendChild(card);
  });
}

function updateProgress() {
  let count = 0;
  questions.forEach((_, idx) => {
    const sel = document.querySelector(`input[name="q${idx}"]:checked`);
    if (sel) count++;
  });
  document.getElementById('progressLabel').textContent = `${count} / ${questions.length} câu đã trả lời`;
  document.getElementById('progressFill').style.width = `${(count / questions.length) * 100}%`;
}

function checkAll() {
  let correct = 0, unanswered = 0;

  questions.forEach((item, idx) => {
    const sel = document.querySelector(`input[name="q${idx}"]:checked`);
    const resEl = document.getElementById(`res-${idx}`);
    const labels = document.querySelectorAll(`#card-${idx} .option-label`);

    // reset styles
    labels.forEach(l => { l.classList.remove('correct', 'wrong'); });

    if (!sel) {
      unanswered++;
      resEl.className = 'result-msg unanswered';
      resEl.textContent = '⚠️ Bạn chưa chọn đáp án!';
    } else {
      const chosen = parseInt(sel.value);
      if (chosen === item.ans) {
        correct++;
        labels[chosen].classList.add('correct');
        resEl.className = 'result-msg correct';
        resEl.textContent = '✓ Chính xác!';
      } else {
        labels[chosen].classList.add('wrong');
        labels[item.ans].classList.add('correct');
        resEl.className = 'result-msg wrong';
        resEl.textContent = `✗ Sai! Đáp án đúng: ${optionLetters[item.ans]}. ${item.opts[item.ans]}`;
      }
    }
  });

  const scoreEl = document.getElementById('score-display');
  scoreEl.style.display = 'block';
  const pct = Math.round((correct / questions.length) * 100);
  scoreEl.innerHTML = `Kết quả: <span>${correct} / ${questions.length}</span> câu đúng &nbsp;·&nbsp; <span>${pct}%</span>`;

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function resetAll() {
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  questions.forEach((_, idx) => {
    const resEl = document.getElementById(`res-${idx}`);
    resEl.className = 'result-msg';
    resEl.textContent = '';
    document.querySelectorAll(`#card-${idx} .option-label`).forEach(l => l.classList.remove('correct', 'wrong'));
  });
  document.getElementById('score-display').style.display = 'none';
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── KHỞI ĐỘNG: nạp đề rồi dựng giao diện ── */
ExamLoader.load().then(exam => {
  ExamLoader.fill(exam);
  let lastSec = null;
  questions = exam.questions.map(x => {
    const sec = exam.sectionById[x.sec];
    const item = {
      q: 'Question ' + x.n + '.' + (x.q ? ' ' + x.q : ''),
      opts: x.opts,
      ans: x.ans
    };
    if (x.sec !== lastSec) item.section = sec.instruction || sec.label;
    lastSec = x.sec;
    return item;
  });
  buildQuiz();
  updateProgress();
}).catch(ExamLoader.fail);
</script>
</body>
</html>
