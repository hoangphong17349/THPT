<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trắc Nghiệm Ngẫu Nhiên</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #20243a;
      --border: #2e3350;
      --ink: #e8eaf6;
      --muted: #7b82a8;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --correct: #00e5a0;
      --wrong: #ff6584;
      --warn: #ffcc00;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 5rem;
    }

    /* ── SCREEN: START ── */
    #screen-start {
      max-width: 520px;
      margin: 5vh auto 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    .badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }

    #screen-start h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.15;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #screen-start p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      border: none;
      padding: 0.9rem 2.8rem;
      font-size: 1.05rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 24px rgba(108,99,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(108,99,255,0.5);
    }

    .btn-primary:active { transform: translateY(0); }

    .stats-row {
      display: flex;
      gap: 2rem;
      justify-content: center;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      text-align: center;
    }

    .stat-box .num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
    }

    .stat-box .lbl {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── SCREEN: QUIZ ── */
    #screen-quiz { display: none; max-width: 700px; margin: 0 auto; }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .q-counter {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .q-counter span { color: var(--ink); font-size: 1.4rem; }

    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-width: 100px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .section-chip {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(108,99,255,0.12);
      border: 1px solid rgba(108,99,255,0.3);
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* Single question card */
    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
      animation: slideIn 0.35s cubic-bezier(.22,.68,0,1.2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: var(--ink);
    }

    .options {
      display: grid;
      gap: 0.7rem;
    }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .opt-btn:hover:not(:disabled) {
      background: rgba(108,99,255,0.1);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .opt-btn:disabled { cursor: default; }

    .opt-btn .letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--border);
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .opt-btn.correct {
      background: rgba(0,229,160,0.1);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .opt-btn.correct .letter { background: var(--correct); color: #000; }

    .opt-btn.wrong {
      background: rgba(255,101,132,0.1);
      border-color: var(--wrong);
      color: var(--wrong);
    }

    .opt-btn.wrong .letter { background: var(--wrong); color: #fff; }

    .feedback {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 1.3em;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      display: none;
    }

    .feedback.correct { color: var(--correct); background: rgba(0,229,160,0.08); display: block; }
    .feedback.wrong   { color: var(--wrong);   background: rgba(255,101,132,0.08); display: block; }

    .nav-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn-next {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-next:hover { opacity: 0.9; transform: translateX(3px); }

    /* ── SCREEN: RESULT ── */
    #screen-result {
      display: none;
      max-width: 600px;
      margin: 4vh auto 0;
      text-align: center;
    }

    .result-ring {
      width: 150px;
      height: 150px;
      margin: 0 auto 1.5rem;
    }

    .result-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

    .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
    .ring-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      transition: stroke-dashoffset 1s ease;
    }

    .ring-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #fff;
    }

    .ring-wrap { position: relative; display: inline-block; }

    #screen-result h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    #screen-result .sub {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .res-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .res-box .rnum {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }

    .res-box .rlbl { font-size: 0.78rem; color: var(--muted); }

    .btn-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      padding: 0.7rem 1.8rem;
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover { background: var(--accent); color: #fff; }

    .review-list {
      margin-top: 2rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .review-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .review-item .ri-q { font-weight: 600; margin-bottom: 0.3rem; }
    .review-item .ri-ans { color: var(--muted); }
    .review-item .ri-ans .correct-a { color: var(--correct); font-weight: 600; }
    .review-item .ri-ans .wrong-a   { color: var(--wrong); text-decoration: line-through; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .dot.c { background: var(--correct); }
    .dot.w { background: var(--wrong); }
  </style>
</head>
<body>

<!-- ── START SCREEN ── -->
<div id="screen-start">
  <div class="badge" data-fill="subject">…</div>
  <h1>Trắc Nghiệm<br>Ngẫu Nhiên</h1>
  <p>Mỗi lượt chơi, hệ thống sẽ <strong>xáo ngẫu nhiên <span data-fill="randomCount">…</span> câu</strong><br>từ bộ <span data-fill="total">…</span> câu hỏi. Chúc bạn làm bài tốt!</p>

  <div class="stats-row">
    <div class="stat-box"><div class="num" data-fill="total">…</div><div class="lbl">Tổng câu hỏi</div></div>
    <div class="stat-box"><div class="num" data-fill="randomCount">…</div><div class="lbl">Câu mỗi lượt</div></div>
    <div class="stat-box"><div class="num" data-fill="sections">…</div><div class="lbl">Phần thi</div></div>
  </div>

  <button class="btn-primary" onclick="startQuiz()">🎲 Bắt đầu ngẫu nhiên</button>
</div>

<!-- ── QUIZ SCREEN ── -->
<div id="screen-quiz">
  <div class="quiz-header">
    <div class="q-counter">Câu <span id="q-num">1</span> / <span id="q-total">…</span></div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:10%"></div></div>
    <div class="section-chip" id="sec-chip">Phần I</div>
  </div>

  <div class="q-card" id="q-card">
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="nav-row">
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Câu tiếp theo →</button>
  </div>
</div>

<!-- ── RESULT SCREEN ── -->
<div id="screen-result">
  <div class="ring-wrap">
    <div class="result-ring">
      <svg viewBox="0 0 140 140">
        <circle class="ring-bg" cx="70" cy="70" r="65"/>
        <circle class="ring-fill" id="ring-fill" cx="70" cy="70" r="65"/>
      </svg>
    </div>
    <div class="ring-text" id="ring-pct">0%</div>
  </div>

  <h2 id="result-title">Kết quả</h2>
  <p class="sub" id="result-sub"></p>

  <div class="result-grid">
    <div class="res-box"><div class="rnum" id="r-correct" style="color:var(--correct)">0</div><div class="rlbl">Đúng</div></div>
    <div class="res-box"><div class="rnum" id="r-wrong" style="color:var(--wrong)">0</div><div class="rlbl">Sai</div></div>
    <div class="res-box"><div class="rnum" id="r-pct">0%</div><div class="rlbl">Tỉ lệ</div></div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" onclick="startQuiz()">🎲 Xáo lại & Chơi tiếp</button>
    <button class="btn-outline" onclick="toggleReview()">📋 Xem lại đáp án</button>
    <button class="btn-outline" onclick="goStart()">🏠 Trang chủ</button>
  </div>

  <div class="review-list" id="review-list" style="display:none"></div>
</div>

<script src="exam-loader.js"></script>
<script>
let ALL_QUESTIONS = [];   // được nạp từ de-kiem-tra.html (xem phần khởi động ở cuối file)

const LETTERS = ['A','B','C','D'];
let SEC_LABELS = {};
let BATCH_SIZE = 10;     // số câu mỗi lượt (lấy từ đề)

let batch = [];        // các câu đã xáo của lượt hiện tại
let current = 0;       // vị trí câu hiện tại (bắt đầu từ 0)
let answered = false;
let userAnswers = [];  // store {chosen, correct} for review
let reviewVisible = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  if (!ALL_QUESTIONS.length) return;   // đề chưa nạp xong
  batch = shuffle(ALL_QUESTIONS).slice(0, BATCH_SIZE);
  current = 0;
  userAnswers = [];
  reviewVisible = false;

  show('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = batch[current];

  document.getElementById('q-num').textContent = current + 1;
  document.getElementById('q-total').textContent = batch.length;
  document.getElementById('prog-fill').style.width = `${((current + 1) / batch.length) * 100}%`;
  document.getElementById('sec-chip').textContent = SEC_LABELS[item.sec] || item.sec;
  document.getElementById('q-text').textContent = item.q;

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  feedback.textContent = '';

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'none';
  btnNext.textContent = current < batch.length - 1 ? 'Câu tiếp theo →' : 'Xem kết quả 🏆';

  const opts = document.getElementById('options');
  opts.innerHTML = '';

  item.opts.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="letter">${LETTERS[oi]}</span> ${opt}`;
    btn.onclick = () => selectAnswer(oi);
    opts.appendChild(btn);
  });

  // animate card
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = ''; });
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;

  const item = batch[current];
  const btns = document.querySelectorAll('.opt-btn');
  const feedback = document.getElementById('feedback');
  const btnNext = document.getElementById('btn-next');

  btns.forEach(b => b.disabled = true);

  if (chosen === item.ans) {
    btns[chosen].classList.add('correct');
    feedback.className = 'feedback correct';
    feedback.textContent = '✓ Chính xác!';
  } else {
    btns[chosen].classList.add('wrong');
    btns[item.ans].classList.add('correct');
    feedback.className = 'feedback wrong';
    feedback.textContent = `✗ Sai! Đáp án đúng: ${LETTERS[item.ans]}. ${item.opts[item.ans]}`;
  }

  userAnswers.push({ q: item.q, opts: item.opts, ans: item.ans, chosen });
  btnNext.style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < batch.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  show('screen-result');

  const total = userAnswers.length;
  const correct = userAnswers.filter(a => a.chosen === a.ans).length;
  const pct = Math.round((correct / total) * 100);

  // ring animation
  const ring = document.getElementById('ring-fill');
  const circumference = 408;
  const offset = circumference - (pct / 100) * circumference;
  ring.style.stroke = pct >= 80 ? 'var(--correct)' : pct >= 50 ? 'var(--accent)' : 'var(--wrong)';
  setTimeout(() => { ring.style.strokeDashoffset = offset; }, 100);

  document.getElementById('ring-pct').textContent = pct + '%';
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = total - correct;
  document.getElementById('r-pct').textContent = pct + '%';

  const titles = ['Cần cố gắng thêm! 💪', 'Khá ổn! Tiếp tục nhé 👍', 'Tốt lắm! 🎉', 'Xuất sắc! 🏆'];
  const ti = pct < 40 ? 0 : pct < 60 ? 1 : pct < 90 ? 2 : 3;
  document.getElementById('result-title').textContent = titles[ti];
  document.getElementById('result-sub').textContent = `Bạn trả lời đúng ${correct}/${total} câu trong lượt này.`;
}

function toggleReview() {
  reviewVisible = !reviewVisible;
  const box = document.getElementById('review-list');
  if (!reviewVisible) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = '';

  userAnswers.forEach((a, i) => {
    const isCorrect = a.chosen === a.ans;
    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <div class="ri-q"><span class="dot ${isCorrect ? 'c' : 'w'}"></span>${i + 1}. ${a.q}</div>
      <div class="ri-ans">
        ${!isCorrect ? `<span class="wrong-a">Bạn chọn: ${LETTERS[a.chosen]}. ${a.opts[a.chosen]}</span><br>` : ''}
        <span class="correct-a">✓ Đáp án: ${LETTERS[a.ans]}. ${a.opts[a.ans]}</span>
      </div>`;
    box.appendChild(item);
  });
}

function goStart() {
  show('screen-start');
}

function show(id) {
  ['screen-start','screen-quiz','screen-result'].forEach(s => {
    document.getElementById(s).style.display = s === id ? (s === 'screen-quiz' ? 'block' : 'flex') : 'none';
  });
  if (id === 'screen-start') document.getElementById('screen-start').style.flexDirection = 'column';
  if (id === 'screen-result') document.getElementById('screen-result').style.flexDirection = 'column';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── KHỞI ĐỘNG: nạp đề ── */
ExamLoader.load().then(exam => {
  ExamLoader.fill(exam);
  ALL_QUESTIONS = exam.questions.map(x => ({ sec: x.sec, q: x.text, opts: x.opts, ans: x.ans }));
  SEC_LABELS = {};
  exam.sections.forEach(sec => { SEC_LABELS[sec.id] = sec.label; });
  BATCH_SIZE = exam.randomCount;
}).catch(ExamLoader.fail);
</script>
</body>
</html>
